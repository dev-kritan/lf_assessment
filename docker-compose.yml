version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: event_planner_mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - event_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "${DB_USER:-eventuser}",
          "-p${DB_PASSWORD:-eventpassword}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: lf_assessment-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event_planner_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_CLIENT: mysql2
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-eventuser}
      DB_PASSWORD: ${DB_PASSWORD:-eventpassword}
      DB_NAME: ${DB_NAME:-event_planner_db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-minimum-32-chars-length}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-super-secret-refresh-key-minimum-32-chars}
      COOKIE_SECRET: ${COOKIE_SECRET:-super-secret-cookie-key}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - event_network

  frontend:
    image: lf_assessment-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: event_planner_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - event_network

volumes:
  mysql_data:

networks:
  event_network:
    driver: bridge
